input:
  smiles_file: str()
  protonate_ligands: bool()

database:
  zinc20_2d_path: str()

property_matching:
  molecular_weight_range: list(num(), min=2, max=2)  # [min_tolerance, max_tolerance]
  logp_range: list(num(), min=2, max=2)               # [min_tolerance, max_tolerance]
  rotatable_bonds_range: list(int(), min=2, max=2)   # [min_tolerance, max_tolerance]
  hb_acceptors_range: list(int(), min=2, max=2)      # [min_tolerance, max_tolerance]
  hb_donors_range: list(int(), min=2, max=2)         # [min_tolerance, max_tolerance]
  charge_range: list(int(), min=2, max=2)            # [min_tolerance, max_tolerance]
  tanimoto_range: list(num(), min=2, max=2)          # [min_similarity, max_similarity]
  num_property_windows: int()                        # number of progressive windows

generation:
  minimum_decoys_per_ligand: int()
  target_decoys_per_ligand: int()
  total_decoys_to_generate: int()
  max_tanimoto_between_decoys: num()
  calculate_tanimoto: bool()
  random_seed: int()

job_submission:
  scheduler: str()
  timeout_minutes: int()
  max_retries: int()
  nodes_exclude: list(str())
  max_retries_per_ligand: int()
  job_timeout_minutes: int()
  scheduler_extra_params: str()

building:
  enabled: bool()

output:
  working_directory: str()
  actives_output: str()
  decoys_output: str()