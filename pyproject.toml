[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pydock3"
version = "0.1.0rc1"
description = "pydock3 is a Python package that serves as a wrapper around the Fortran program UCSF DOCK that also provides tools to help standardize and automate the computational methods employed in molecular docking. It is specifically tailored to work with DOCK 3.8 and later versions, but is intended to have utility beyond this scope."
authors = [{ name = "Ian Scott Knight", email = "ian.knight@ucsf.edu" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.8.1,<3.11"
dependencies = [
    "numpy>=1.21.5,<2",
    "scipy>=1.7.3,<2",
    "fire>=0.4.0,<0.5",
    "python-dotenv>=0.20.0,<0.21",
    "PyYAML>=6.0,<7",
    "yamale>=4.0.4,<5",
    "oyaml>=1.0,<2",
    "networkx>=2.8,<3",
    "matplotlib>=3.5.1,<4",
    "rdkit-pypi>=2022.3.2,<2023",
    "pandas>=1.4.2,<2",
    "seaborn>=0.13.2,<0.14",
    "joypy>=0.2.6,<0.3",
    "typing-extensions>=4.5.0,<5",
    "xmltodict>=0.13.0,<0.14",
    "plotly>=5.14.1,<6",
    "pillow>=9.5.0,<10",
    "tornado>=6.3.2,<7",
    "timeout-decorator>=0.5.0,<0.6",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=2.18.1,<3",
    "jupyter>=1.0.0,<2",
    "black>=21.12b0,<22",
    "vulture>=2.3,<3",
    "openpyxl>=3.0.10,<4",
    "notebook>=6.4.12,<7",
    "setuptools>=65.5.1,<66",
    "pytest>=7.2.0,<8",
]

[project.scripts]
pydock3 = "pydock3.scripts:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# the wheel holds executables, not Python extensions: any Python 3, one wheel per platform
wheel.py-api = "py3"
sdist.exclude = ["tests/blastermaster/controls"]

[tool.cibuildwheel]
build = "cp310-*"  # the wheel works with any Python 3, so one build per platform
skip = "*-musllinux_*"
archs = ["native"]
config-settings = { "cmake.define.PYDOCK3_STATIC_RUNTIME" = "ON" }
# (the plugin shows test failures as annotations on GitHub)
test-requires = ["pytest~=7.2", "pytest-github-actions-annotate-failures"]  # (no "<": Windows' shell)
# (live logging shows when each blastermaster step starts)
test-command = "pytest -o log_cli=true --log-cli-level=INFO --durations=0 {project}/tests/blastermaster"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
